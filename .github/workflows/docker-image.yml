name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PSS }}

      - name: Build Docker Image
        run: |
          docker build -t e255997960/docker-graphql:1.0.1 .
          docker build -t e255997960/docker-graphql:latest

      - name: Push Docker Image
        run: |
          docker push e255997960/docker-graphql:1.0.1
          docker push e255997960/docker-graphql:latest
